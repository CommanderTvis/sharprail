# Loaded with MISE_ENV=android (the bootstrap:android task): the NDK the Android client's native libraries are
# built with, kept out of the default install because they are large.
[settings]
lockfile = true

[tools."http:android-ndk"]
version = "r27d"
os = ["macos", "linux"]
[tools."http:android-ndk".platforms.macos-arm64]
url = "https://dl.google.com/android/repository/android-ndk-r27d-darwin.zip"
checksum = "sha256:e69092f9d2bfa5d1199039980a14eb91c03cc971ab5c6968fc08a8e6b84e7bb7"
[tools."http:android-ndk".platforms.macos-x64]
url = "https://dl.google.com/android/repository/android-ndk-r27d-darwin.zip"
checksum = "sha256:e69092f9d2bfa5d1199039980a14eb91c03cc971ab5c6968fc08a8e6b84e7bb7"
[tools."http:android-ndk".platforms.linux-x64]
url = "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip"
checksum = "sha256:601246087a682d1944e1e16dd85bc6e49560fe8b6d61255be2829178c8ed15d9"

# Merman's Android archive (the same release as the desktop pin in mise.toml): its jni/<abi>/libmerman_ffi.so are the C
# ABI the desktop dylib exports, 16 KB aligned, which the Android client packages as libSharpRailMermaid.so. The release's
# sha256.sum does not list the .aar; the checksum is GitHub's published asset digest and matches the downloaded file.
[tools."http:merman-android"]
version = "0.7.0"
os = ["macos", "linux"]
url = "https://github.com/Latias94/merman/releases/download/v0.7.0/merman-android-v0.7.0.aar"
checksum = "sha256:16e62f3079bef0b16748f9c0acbc3e8675fbdca35414cb97436212a2e34f0334"
format = "zip"
