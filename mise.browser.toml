# Loaded with MISE_ENV=browser (`scripts/tool node` and friends): the toolchain of the WASM client.
[settings]
lockfile = true

[tools]
node = "24.11.0"
pnpm = "10.20.0"
uv = "0.9.5"

# Binaryen for the browser build's wasm-opt.
[tools."http:binaryen"]
version = "131"
os = ["macos", "linux"]
[tools."http:binaryen".platforms.macos-arm64]
url = "https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-arm64-macos.tar.gz"
checksum = "sha256:e441b48dc22163d209b4f05e44dc7210909b01237642b6c9ae48fd710a3ef83e"
[tools."http:binaryen".platforms.macos-x64]
