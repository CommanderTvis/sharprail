# The toolchain manifest of this checkout. mise installs the pins below on demand (`scripts/mise run <task>`, or
# `scripts/mise install`) into its own data directory, which every checkout and worktree of the user shares, and
# `scripts/tool <name>` prints where one is; mise.lock holds
# the resolved versions and archive checksums of every platform and is committed. The Android NDK
# (mise.android.toml) and the browser toolchain (mise.browser.toml) have their own files and locks so that the
# default install stays small. Pinned here as well: the .NET SDK (global.json must name the same version) and the
# Ghostty commits. Whatever mise cannot express stays in the recipe that builds it, which reads its pin from [env].
min_version = "2026.10.13"

[settings]
lockfile = true

[tools]
# libghostty (the macOS view) builds with 0.14.1, libghostty-vt with 0.16.0.
zig = ["0.14.1", "0.16.0"]

# The .NET SDK (global.json must name the same version). mise's core dotnet backend records no URL or checksum, so the
# archives come from Microsoft's release metadata (builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json,
# which lists SHA-512; the SHA-256 below was computed from archives matching it).
[tools."http:dotnet"]
version = "10.0.401"
[tools."http:dotnet".platforms.macos-arm64]
url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.401/dotnet-sdk-10.0.401-osx-arm64.tar.gz"
checksum = "sha256:d143ccec4474dce17d7b778854598137a2599b81828bce51e809897fe8bdf035"
[tools."http:dotnet".platforms.macos-x64]
url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.401/dotnet-sdk-10.0.401-osx-x64.tar.gz"
checksum = "sha256:0616332aa0b5edfa19443a9d217d14d086d2e9605d7c72979cf8ebbb494ac792"
[tools."http:dotnet".platforms.linux-x64]
url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.401/dotnet-sdk-10.0.401-linux-x64.tar.gz"
checksum = "sha256:137268c8ad939c064ff1ee2a6fdf0899d8725377114ea012fbd1ad5fa2550418"
[tools."http:dotnet".platforms.linux-arm64]
url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.401/dotnet-sdk-10.0.401-linux-arm64.tar.gz"
checksum = "sha256:91d3d67f2ed065909bd2e1ba50a37192aff6df15178304939d5b55634d72da6a"
[tools."http:dotnet".platforms.windows-x64]
url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.401/dotnet-sdk-10.0.401-win-x64.zip"
checksum = "sha256:c1b96dea223e1ab2af8a51187e0cc96338d14c68834be1656136be18953cea09"
[tools."http:dotnet".platforms.windows-arm64]
url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.401/dotnet-sdk-10.0.401-win-arm64.zip"
checksum = "sha256:adfcd206adaa407d45d97a8678b9c36bb83089ba520eda6a97ab5a707c9af583"

# mise's core Zig has no Windows ARM64 build, so the Windows natives use this archive on both architectures.
[tools."http:zig-windows"]
version = "0.16.0"
os = ["windows"]
[tools."http:zig-windows".platforms.windows-x64]
url = "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip"
checksum = "sha256:68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e"
[tools."http:zig-windows".platforms.windows-arm64]
url = "https://ziglang.org/download/0.16.0/zig-aarch64-windows-0.16.0.zip"
checksum = "sha256:aee38316ee4111717900f45dd3130145c39289e105541d737eb8c5ed653c78ef"

# Merman's release publishes its C ABI for Apple platforms as a static xcframework; the UI links it into a dylib.
[tools."http:merman"]
version = "0.7.0"
os = ["macos"]
url = "https://github.com/Latias94/merman/releases/download/v0.7.0/Merman.xcframework-v0.7.0.zip"
checksum = "sha256:29a46ea5da99bad60888581073e88345ce370366a4855b4e2996355a7d0e880b"

# Eclipse Temurin JDK 21 (`scripts/tool jdk`): the JDK the Android build and the JVM language checks run with, so no
# machine JDK (or SDKMAN) is needed for development. The checksums are those of the Adoptium release's .sha256.txt
# assets and match the downloaded archives. The macOS archives keep the JDK home under Contents/Home; the link
# scripts/tool prints that home. There is no Windows pin: the Windows zip stores bin/server/classes*.jsa
# read-only, and mise's http backend then fails the extraction with "Access is denied" when it resets the extracted
# files' mtimes (it opens each one for writing). On Windows, JAVA_HOME names the JDK.
[tools."http:jdk"]
version = "21.0.12.1+1"
os = ["linux", "macos"]
[tools."http:jdk".platforms.macos-arm64]
url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_aarch64_mac_hotspot_21.0.12.1_1.tar.gz"
checksum = "sha256:3623232f33a9c3baadf304480b2535f9a3cba8a58d42ecbb438ba267315d9998"
[tools."http:jdk".platforms.macos-x64]
url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_mac_hotspot_21.0.12.1_1.tar.gz"
checksum = "sha256:44db0f08196daf19a47f90d13388b0c943b67663cb537f998fe29e836fa842ce"
[tools."http:jdk".platforms.linux-x64]
url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz"
checksum = "sha256:ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94"
[tools."http:jdk".platforms.linux-arm64]
url = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_aarch64_linux_hotspot_21.0.12.1_1.tar.gz"
checksum = "sha256:23e37e026f12f3e706f18938ff611db3032d075b09d0879a25d06718c773e223"

# The Linux AppImage is a pinned type 2 runtime followed by a squashfs image, which appimagetool writes. Both are
# single files from tagged releases (the install keeps them as appimagetool/appimagetool.AppImage and
# appimage-runtime/runtime under `scripts/tool`'s directories); appimagetool is itself an AppImage and runs with APPIMAGE_EXTRACT_AND_RUN=1.
[tools."http:appimagetool"]
version = "1.9.1"
os = ["linux"]
[tools."http:appimagetool".platforms.linux-x64]
url = "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
checksum = "sha256:ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
[tools."http:appimagetool".platforms.linux-arm64]
url = "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-aarch64.AppImage"
checksum = "sha256:f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158"
[tools."http:appimage-runtime"]
version = "20251108"
os = ["linux"]
[tools."http:appimage-runtime".platforms.linux-x64]
url = "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
checksum = "sha256:2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
[tools."http:appimage-runtime".platforms.linux-arm64]
url = "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-aarch64"
checksum = "sha256:00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444"

[env]
# NuGet restores in locked mode: each project's packages.lock.json (versions and content hashes) must match, else
# NU1004/NU1403. `mise run restore:update` is the one task that may change the locks.
RestoreLockedMode = "true"
# Pinned Ghostty revisions, fetched by commit by the recipes that build them, with the Zig each builds with
# (a version listed under [tools]; `scripts/tool zig-<version>`).
GHOSTTY_VIEW_COMMIT = "6d2dd585a5d87fa745d48188dd096ca6e63014d0" # v1.2.3
GHOSTTY_VIEW_ZIG = "0.14.1"
GHOSTTY_VT_COMMIT = "59c2dc032aba42aa5064bf206cc27286add3e9d8"
GHOSTTY_VT_ZIG = "0.16.0"
# Zig's global cache (fetched package sources, compiled helpers) is content-addressed and locks per entry, so
# checkouts share one; the per-build caches stay beside each checkout's outputs.
ZIG_GLOBAL_CACHE_DIR = "{{ env.XDG_CACHE_HOME | default(value=env.HOME ~ '/.cache') }}/sharprail/zig"

# ARTIFACT MATRIX (printed by `scripts/mise run targets`; the one place that says what ships where)
#
# target         built on          native libraries (MSBuild targets in the owning project)                   terminal                    publish task                 package
# macos-arm64    macOS arm64       libGhosttyAvaloniaView, libGhosttyAvaloniaVt,                               Ghostty Metal texture       package:macos osx-arm64      artifacts/SharpRail.app, dmg task -> .dmg
#                                  libSharpRailMermaid, libSharpRailNotifications                              (Skia fallback)
# macos-x64      macOS x64         as macos-arm64 for x86_64                                                   as macos-arm64              package:macos osx-x64        artifacts/SharpRail.app
# linux-x64      Linux x64         libGhosttyAvaloniaVt.so (Zig, glibc 2.31)                                  libghostty-vt on Skia       package:linux                artifacts/SharpRail-linux-x64.AppImage
# linux-arm64    Linux arm64       as linux-x64 for aarch64 (Zig, glibc 2.31); builds natively on an arm64 host  as linux-x64              package:linux linux-arm64    artifacts/SharpRail-linux-arm64.AppImage
# windows-x64    Windows x64       GhosttyAvaloniaVt.dll                                                        libghostty-vt on Skia       package:windows win-x64      artifacts/SharpRail-win-x64.zip
# windows-arm64  Windows ARM64     as windows-x64 for win-arm64 (builds natively on an ARM64 host)              libghostty-vt on Skia       package:windows win-arm64    artifacts/SharpRail-win-arm64.zip
# android        macOS or Linux    libGhosttyAvaloniaVt.so (arm64-v8a, x86_64)                                 libghostty-vt on Skia       package:android              artifacts/android/SharpRail.apk
# browser        macOS or Linux    GhosttyAvaloniaVt.a (WASM) + Restty/Merman/PDFium                          Restty                      package:browser              artifacts/browser
# END MATRIX

[tasks.targets]
description = "Print the artifact matrix: target, native libraries, terminal renderer, publish task"
run = "sed -n '/^# ARTIFACT MATRIX/,/^# END MATRIX/p' mise.toml"
run_windows = "powershell -NoProfile -Command \"Get-Content mise.toml | Select-String -Pattern '^# ' | ForEach-Object { $_.Line }\""

[tasks.build]
description = "Release build of SharpRail.slnx: the compiler gate, and every native library that is out of date"
run = "dotnet build SharpRail.slnx -c Release"

[tasks.restore]
description = "Restore the solution's packages in locked mode (packages.lock.json, nuget.org only)"
run = "dotnet restore SharpRail.slnx"

[tasks."restore:update"]
description = "Re-resolve packages and rewrite the packages.lock.json files; use after changing a package version or reference, then commit the locks"
env = { RestoreLockedMode = "false" }
run = ["dotnet restore SharpRail.slnx --force-evaluate", "dotnet restore scripts/host-link.cs --force-evaluate"]
run_windows = ["dotnet restore SharpRail.slnx --force-evaluate", "dotnet restore scripts\\host-link.cs --force-evaluate"]

[tasks.audit]
description = "Fail on any known vulnerability (moderate or above, transitive included) in the locked packages"
run = "dotnet restore SharpRail.slnx --force -p:WarningsNotAsErrors="

[tasks.format]
description = "Verify formatting as CI does; pass --include with touched files to scope it"
run = "dotnet format SharpRail.slnx --verify-no-changes --no-restore"

[tasks.check]
description = "Run the checks executable (mise run check -- --terminals, --case A,B ...)"
run = "dotnet run --project tests/SharpRail.Checks -c Release --"

[tasks.perf]
description = "Run the profiling harness (mise run perf -- self-test)"
run = "sh performance/run.sh"

[tasks.rpc]
description = "Regenerate the typed RPC clients and dispatch from the host contracts"
run = "uv run --no-project python scripts/generate-rpc.py"

[tasks.dev]
description = "Build the desktop app from source and run it in Release (SHARPRAIL_CONFIGURATION=Debug to debug; SHARPRAIL_PROFILE, SHARPRAIL_ROOT)"
run = "sh scripts/tasks/dev.sh"
run_windows = "scripts\\tasks\\dev.bat"

[tasks.host]
description = "Run only the remote host and print its connection QR code (SHARPRAIL_CONNECT_HOST)"
run = "sh scripts/tasks/host.sh"
run_windows = "scripts\\tasks\\host.bat"

[tasks."package:macos"]
description = "Publish the app, host and checks and build artifacts/SharpRail.app (osx-arm64 by default, or osx-x64)"
run = "sh scripts/tasks/package-macos.sh"

[tasks."zig-deps:mirror"]
description = "Rebuild scripts/zig-deps.lock and the Zig dependency mirror archive after a Ghostty pin change (uploads nothing)"
run = "sh scripts/tasks/zig-deps-mirror.sh"

[tasks.dmg]
description = "Pack artifacts/SharpRail.app into a disk image (path argument optional)"
run = "sh scripts/tasks/dmg.sh"

[tasks."package:windows"]
description = "Publish the Windows client, host and checks and zip them (-RuntimeIdentifier win-x64 or win-arm64)"
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tasks/package-windows.ps1"
run = "echo 'Windows packages are built on Windows.' >&2; exit 1"

[tasks."package:linux"]
description = "Publish the Linux client and checks and build artifacts/SharpRail-linux-<x64|arm64>.AppImage (linux-x64 by default, or `linux-arm64`; builds on Linux)"
run = "sh scripts/tasks/package-linux.sh"

[tasks."package:android"]
description = "Build the signed Release Android package into artifacts/android/SharpRail.apk"
run = "sh scripts/tasks/android.sh apk"

[tasks.android]
description = "Build, install and start the Android client (build|run|apk)"
run = "sh scripts/tasks/android.sh"

[tasks."package:browser"]
description = "Publish the browser client into artifacts/browser"
run = "sh scripts/tasks/browser.sh publish"

[tasks.browser]
description = "Build, run, publish or check the browser client (build|run|publish|check)"
run = "sh scripts/tasks/browser.sh"
run_windows = "scripts\\tasks\\browser.bat"

[tasks."check:packaged"]
description = "Run the check gate from the published package (macOS bundle, the Linux AppImage payload, or -RuntimeIdentifier on Windows)"
run = "sh scripts/tasks/check-packaged.sh"
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tasks/check-packaged.ps1"

[tasks."check:terminal"]
description = "Build the Ghostty libraries and run the native shell/Metal probe (macOS)"
run = "sh scripts/tasks/check-terminal.sh"

[tasks."check:fsevents"]
description = "Run the FSEvents resource-lifetime check with the checks' interposer (macOS)"
run = "sh scripts/tasks/check-fsevents.sh"
