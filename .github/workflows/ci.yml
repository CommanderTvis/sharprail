name: CI

on:
  push:
    branches: [main, upstream]
  pull_request:
  workflow_dispatch:

env:
  # Every tool must come from mise.lock, with its checksum.
  MISE_LOCKED: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/sharprail
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}
      - run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Restore" sh scripts/mise run restore
      - run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Audit" sh scripts/mise run audit
      - run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Format" sh scripts/mise run format
      - run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Build" sh scripts/mise run build
      - run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Perf self-test" sh scripts/mise run perf -- self-test
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: build

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [sync, workspaces, terminals]
        include:
          - { mode: full, shard: 1/3 }
          - { mode: full, shard: 2/3 }
          - { mode: full, shard: 3/3 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/sharprail
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}
      - run: |
          git config --global user.name CI
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - env:
          SHARPRAIL_CHECKS_JOB_SHARD: ${{ matrix.shard }}
          SHARPRAIL_CHECKS_KEEP_GOING: "1"
        run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Checks ${{ matrix.mode }} ${{ matrix.shard }}" sh scripts/mise run check ${{ matrix.mode != 'full' && format('-- --{0}', matrix.mode) || '' }}
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: smoke-${{ strategy.job-index }}

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\mise
            ~\AppData\Local\sharprail\cache
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}
      - run: ./scripts/mise.cmd x -- dotnet run --file scripts/ci-run.cs -- "Package Windows" ./scripts/mise.cmd run package:windows -- -RuntimeIdentifier win-x64
      - run: ./scripts/mise.cmd x -- dotnet run --file scripts/ci-run.cs -- "Format" ./scripts/mise.cmd run format
      - env:
          SHARPRAIL_CHECKS_KEEP_GOING: "1"
        run: ./scripts/mise.cmd x -- dotnet run --file scripts/ci-run.cs -- "Packaged check Windows" ./scripts/mise.cmd run check:packaged -- -RuntimeIdentifier win-x64 --windows
      - uses: actions/upload-artifact@v7
        with:
          name: SharpRail-win-x64
          path: artifacts/SharpRail-win-x64.zip
          if-no-files-found: error
      # The plugin channel and runner process (Linux runs it in the smoke gate), from the checks' framework-dependent build.
      - run: ./scripts/mise.cmd x -- dotnet run --file scripts/ci-run.cs -- "Plugin channel Windows" ./scripts/mise.cmd run check -- --plugin-channel
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: windows

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/sharprail
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}
      - run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Package Linux" sh scripts/mise run package:linux
      - env:
          SHARPRAIL_CHECKS_KEEP_GOING: "1"
        run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Packaged check Linux" sh scripts/mise run check:packaged -- --linux
      - uses: actions/upload-artifact@v7
        with:
          name: SharpRail-linux-x64
          path: artifacts/SharpRail-linux-x64.AppImage
          if-no-files-found: error
          compression-level: 0
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: linux

  # Not a required check: the arm64 Linux port is new, so it reports without gating merges.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/sharprail
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}
      - run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Package Linux ARM64" sh scripts/mise run package:linux linux-arm64
      - env:
          SHARPRAIL_CHECKS_KEEP_GOING: "1"
        run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Packaged check Linux ARM64" sh scripts/mise run check:packaged -- --linux
      - uses: actions/upload-artifact@v7
        with:
          name: SharpRail-linux-arm64
          path: artifacts/SharpRail-linux-arm64.AppImage
          if-no-files-found: error
          compression-level: 0
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: linux-arm64

  # The macOS package: the NativeAOT app and host, checked by the packaged gate's --packaged mode, and the plugin
  # channel checks (--plugin-channel; the sandbox checks join them later).
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # build-native.sh archives libghostty with Homebrew's llvm-ar.
      - run: brew install llvm
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/sharprail
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}
      - run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Package macOS" sh scripts/mise run package:macos osx-arm64
      - env:
          SHARPRAIL_CHECKS_KEEP_GOING: "1"
        run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Packaged check macOS" sh scripts/mise run check:packaged -- --packaged
      - run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Plugin channel macOS" sh scripts/mise run check -- --plugin-channel
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: macos
