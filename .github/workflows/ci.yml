name: CI

on:
  push:
    branches: [main, upstream]
  pull_request:
  workflow_dispatch:

env:
  # Every tool must come from mise.lock, with its checksum.
  MISE_LOCKED: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: ~/.sharprail/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}
      - run: sh scripts/mise run restore
      - run: sh scripts/mise run format
      - run: sh scripts/mise run build
      - run: sh scripts/mise run perf -- self-test

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [sync, workspaces, terminals]
        include:
          - { mode: full, shard: 1/3 }
          - { mode: full, shard: 2/3 }
          - { mode: full, shard: 3/3 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: ~/.sharprail/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}
      - run: |
          git config --global user.name CI
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - env:
          SHARPRAIL_CHECKS_JOB_SHARD: ${{ matrix.shard }}
        run: sh scripts/mise run check ${{ matrix.mode != 'full' && format('-- --{0}', matrix.mode) || '' }}

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: ~\.sharprail\tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}
      - run: ./scripts/mise.cmd run package:windows -- -RuntimeIdentifier win-x64
      - run: ./scripts/mise.cmd run format
      - run: ./scripts/mise.cmd run check:packaged -- -RuntimeIdentifier win-x64 --windows
      - uses: actions/upload-artifact@v4
        with:
          name: SharpRail-win-x64
          path: artifacts/SharpRail-win-x64.zip
          if-no-files-found: error
