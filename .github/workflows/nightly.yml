name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every tool must come from mise.lock, with its checksum.
  MISE_LOCKED: '1'

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - id: stamp
        run: echo "name=SharpRail-nightly-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # build-native.sh archives libghostty with Homebrew's llvm-ar.
      - run: brew install llvm
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/sharprail
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'mise.android.toml', 'mise.android.lock') }}
      - run: sh scripts/mise x -- dotnet run scripts/ci-run.cs -- "Package macOS" sh scripts/mise run package:macos osx-arm64
      - run: sh scripts/mise x -- dotnet run scripts/ci-run.cs -- "Packaged check macOS" sh scripts/mise run check:packaged -- --packaged
      - run: sh scripts/mise x -- dotnet run scripts/ci-run.cs -- "Disk image" sh scripts/mise run dmg "artifacts/${{ steps.stamp.outputs.name }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stamp.outputs.name }}-macos-arm64
          path: artifacts/${{ steps.stamp.outputs.name }}.dmg
          if-no-files-found: error
          compression-level: 0
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: dmg

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: stamp
        run: echo "name=SharpRail-nightly-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/sharprail
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'mise.android.toml', 'mise.android.lock') }}
      # The Android workload compiles against this platform, which the runner image may not carry yet.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      # The build uses the repo's pinned JDK (`scripts/tool jdk`); the image's JAVA_HOME would override it.
      - run: sh scripts/mise x -- dotnet run scripts/ci-run.cs -- "Package Android" sh scripts/mise run package:android
        env:
          JAVA_HOME: ""
      # One key for every night, so a newer package installs over an older one. The build signs with the debug key; apksigner replaces that signature.
      - env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "::error::ANDROID_SIGNING_KEY is not set"; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/android-key.pk8"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" sign --key "$RUNNER_TEMP/android-key.pk8" --cert signing/android-cert.pem artifacts/android/SharpRail.apk
          rm -f "$RUNNER_TEMP/android-key.pk8"
          "$apksigner" verify --print-certs artifacts/android/SharpRail.apk | tee "$RUNNER_TEMP/certs.txt"
          expected=$(openssl x509 -in signing/android-cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d : | tr A-F a-f)
          grep -qi "certificate SHA-256 digest: $expected" "$RUNNER_TEMP/certs.txt" || { echo "::error::APK is not signed with signing/android-cert.pem"; exit 1; }
      - run: mv artifacts/android/SharpRail.apk "artifacts/android/${{ steps.stamp.outputs.name }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stamp.outputs.name }}-android
          path: artifacts/android/${{ steps.stamp.outputs.name }}.apk
          if-no-files-found: error
          compression-level: 0
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: apk

  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/sharprail
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'mise.android.toml', 'mise.android.lock') }}
      # The AppImage carries an embedded signature, so the key is in the keyring before the package step.
      - env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          [ -n "$GPG_SIGNING_KEY" ] || { echo "::error::GPG_SIGNING_KEY is not set"; exit 1; }
          printf '%s' "$GPG_SIGNING_KEY" | gpg --batch --import
      - env:
          SHARPRAIL_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: sh scripts/mise x -- dotnet run scripts/ci-run.cs -- "Package Linux" sh scripts/mise run package:linux
      - env:
          SHARPRAIL_CHECKS_KEEP_GOING: "1"
        run: sh scripts/mise x -- dotnet run scripts/ci-run.cs -- "Packaged check Linux" sh scripts/mise run check:packaged -- --linux
      - uses: actions/upload-artifact@v7
        with:
          name: SharpRail-nightly-linux-x64
          path: artifacts/SharpRail-linux-x64.AppImage
          if-no-files-found: error
          compression-level: 0
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: appimage

  # arm64 does not gate the release: the release job waits for this job but publishes without its asset when it fails
  # (the job itself still shows red).
  appimage-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/sharprail
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'mise.android.toml', 'mise.android.lock') }}
      # The AppImage carries an embedded signature, so the key is in the keyring before the package step.
      - env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          [ -n "$GPG_SIGNING_KEY" ] || { echo "::error::GPG_SIGNING_KEY is not set"; exit 1; }
          printf '%s' "$GPG_SIGNING_KEY" | gpg --batch --import
      - env:
          SHARPRAIL_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: sh scripts/mise x -- dotnet run scripts/ci-run.cs -- "Package Linux ARM64" sh scripts/mise run package:linux linux-arm64
      - env:
          SHARPRAIL_CHECKS_KEEP_GOING: "1"
        run: sh scripts/mise x -- dotnet run scripts/ci-run.cs -- "Packaged check Linux ARM64" sh scripts/mise run check:packaged -- --linux
      - uses: actions/upload-artifact@v7
        with:
          name: SharpRail-nightly-linux-arm64
          path: artifacts/SharpRail-linux-arm64.AppImage
          if-no-files-found: error
          compression-level: 0
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: appimage-arm64

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        # Native MSBuild targets invoke Windows PowerShell; keep its module path consistent.
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\mise
            ~\AppData\Local\sharprail\cache
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'mise.android.toml', 'mise.android.lock') }}
      # Native build scripts still validate their source fingerprints before reusing either DLL.
      - uses: actions/cache/restore@v6
        id: windows-native
        with:
          path: |
            src/Ghostty.Avalonia/obj/native/win-x64/GhosttyAvaloniaVt.dll
            src/Ghostty.Avalonia/obj/native/win-x64/fingerprint
          key: windows-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.gitattributes', 'global.json', 'Directory.Build.props', 'Directory.Packages.props', 'mise.lock', 'scripts/windows-native.ps1', 'src/Ghostty.Avalonia/build-windows.ps1', 'src/Ghostty.Avalonia/Native/GhosttyVt.c', 'src/Ghostty.Avalonia/Native/GhosttyClipboardStub.c') }}
      - run: ./scripts/mise.cmd x -- dotnet run scripts/ci-run.cs -- "Package Windows x64" ./scripts/mise.cmd run package:windows -- -RuntimeIdentifier win-x64
      # Save validated native outputs even when the subsequent packaged runtime gate fails.
      - uses: actions/cache/save@v6
        if: steps.windows-native.outputs.cache-hit != 'true'
        with:
          path: |
            src/Ghostty.Avalonia/obj/native/win-x64/GhosttyAvaloniaVt.dll
            src/Ghostty.Avalonia/obj/native/win-x64/fingerprint
          key: ${{ steps.windows-native.outputs.cache-primary-key }}
      - env:
          SHARPRAIL_CHECKS_KEEP_GOING: "1"
        run: ./scripts/mise.cmd x -- dotnet run scripts/ci-run.cs -- "Packaged check Windows x64" ./scripts/mise.cmd run check:packaged -- -RuntimeIdentifier win-x64 --windows
      - uses: actions/upload-artifact@v7
        with:
          name: SharpRail-nightly-windows-x64
          path: artifacts/SharpRail-win-x64.zip
          if-no-files-found: error
          compression-level: 0
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: windows

  # Zig 0.16.0 cannot link its own build runner on the windows-11-arm runner (every `zig build` crashes with 0xC0000005,
  # see probe-windows-arm64-zig.yml), so libghostty-vt for win-arm64 is cross-compiled on an x64 host. The packaging job
  # restores the DLL and its fingerprint into src/Ghostty.Avalonia/obj/native, where build-windows.ps1 verifies the fingerprint (target, CPU,
  # Ghostty commit, scripts and sources) and skips Zig when it matches, so a stale DLL is rebuilt, never shipped.
  ghostty-windows-arm64:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\mise
            ~\AppData\Local\sharprail\cache
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'mise.android.toml', 'mise.android.lock') }}
      - run: ./scripts/mise.cmd x -- dotnet run scripts/ci-run.cs -- "Cross-build Ghostty for Windows ARM64" ./scripts/mise.cmd x -- powershell -NoProfile -ExecutionPolicy Bypass -File src/Ghostty.Avalonia/build-windows.ps1 -RuntimeIdentifier win-arm64 -Cache src/Ghostty.Avalonia/obj/native
      - uses: actions/upload-artifact@v7
        with:
          name: ghostty-vt-windows-arm64
          path: |
            src/Ghostty.Avalonia/obj/native/win-arm64/GhosttyAvaloniaVt.dll
            src/Ghostty.Avalonia/obj/native/win-arm64/fingerprint
          if-no-files-found: error
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: ghostty-windows-arm64

  windows-arm64:
    needs: ghostty-windows-arm64
    runs-on: windows-11-arm
    timeout-minutes: 90
    defaults:
      run:
        # Native MSBuild targets invoke Windows PowerShell; keep its module path consistent.
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\mise
            ~\AppData\Local\sharprail\cache
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'mise.android.toml', 'mise.android.lock') }}
      # Native build scripts still validate their source fingerprints before reusing either DLL.
      - uses: actions/cache/restore@v6
        id: windows-native
        with:
          path: |
            src/Ghostty.Avalonia/obj/native/win-arm64/GhosttyAvaloniaVt.dll
            src/Ghostty.Avalonia/obj/native/win-arm64/fingerprint
          key: windows-native-arm64-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.gitattributes', 'global.json', 'Directory.Build.props', 'Directory.Packages.props', 'mise.lock', 'scripts/windows-native.ps1', 'src/Ghostty.Avalonia/build-windows.ps1', 'src/Ghostty.Avalonia/Native/GhosttyVt.c', 'src/Ghostty.Avalonia/Native/GhosttyClipboardStub.c') }}
      # The cross-built libghostty-vt replaces any cached one; build-windows.ps1 still checks its fingerprint.
      - uses: actions/download-artifact@v8
        with:
          name: ghostty-vt-windows-arm64
          path: src/Ghostty.Avalonia/obj/native/win-arm64
      - run: ./scripts/mise.cmd x -- dotnet run scripts/ci-run.cs -- "Package Windows ARM64" ./scripts/mise.cmd run package:windows -- -RuntimeIdentifier win-arm64
      # Save validated native outputs even when the subsequent packaged runtime gate fails.
      - uses: actions/cache/save@v6
        if: steps.windows-native.outputs.cache-hit != 'true'
        with:
          path: |
            src/Ghostty.Avalonia/obj/native/win-arm64/GhosttyAvaloniaVt.dll
            src/Ghostty.Avalonia/obj/native/win-arm64/fingerprint
          key: ${{ steps.windows-native.outputs.cache-primary-key }}
      - env:
          SHARPRAIL_CHECKS_KEEP_GOING: "1"
        run: ./scripts/mise.cmd x -- dotnet run scripts/ci-run.cs -- "Packaged check Windows ARM64" ./scripts/mise.cmd run check:packaged -- -RuntimeIdentifier win-arm64 --windows
      - uses: actions/upload-artifact@v7
        with:
          name: SharpRail-nightly-windows-arm64
          path: artifacts/SharpRail-win-arm64.zip
          if-no-files-found: error
          compression-level: 0
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: windows-arm64

  release:
    needs: [dmg, apk, appimage, appimage-arm64, windows, windows-arm64]
    # Only the three packages the nightly exists for gate the release. The ARM64 AppImage and both Windows ZIPs attach when
    # they were built and are listed as missing in the notes when not, so a red Windows job never withholds the release.
    if: ${{ !cancelled() && needs.dmg.result == 'success' && needs.apk.result == 'success' && needs.appimage.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: SharpRail-nightly-*
          merge-multiple: true
      # One prerelease that moves: the tag follows the commit, and the files keep their names from night to night. The
      # previous release is never deleted before the new files are up, so a failing night leaves the last good release.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          mv packages/*.dmg SharpRail-nightly.dmg
          mv packages/*.apk SharpRail-nightly.apk
          mv packages/SharpRail-linux-x64.AppImage SharpRail-nightly-linux-x64.AppImage
          assets="SharpRail-nightly.dmg SharpRail-nightly.apk SharpRail-nightly-linux-x64.AppImage"
          missing=""
          for pair in SharpRail-linux-arm64.AppImage:SharpRail-nightly-linux-arm64.AppImage SharpRail-win-x64.zip:SharpRail-nightly-win-x64.zip SharpRail-win-arm64.zip:SharpRail-nightly-win-arm64.zip; do
            src="packages/${pair%%:*}"
            dst="${pair##*:}"
            if [ -f "$src" ]; then
              mv "$src" "$dst"
              assets="$assets $dst"
            else
              missing="$missing $dst"
              echo "::warning::$dst was not built tonight; releasing without it"
            fi
          done
          notes="Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%d). The disk image is for Apple silicon and is not notarized; the Android package is a client for a SharpRail host; the Linux AppImages are for distributions with glibc 2.31 or newer (run it with --appimage-extract-and-run when FUSE is unavailable); the unsigned Windows x64 and ARM64 ZIPs each contain the desktop client and standalone host."
          if [ -n "$missing" ]; then
            notes="$notes

          Not built tonight, so not attached:$missing"
          fi
          if gh release view nightly > /dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload nightly $assets --clobber
            # Drop assets this night did not produce, so an old file never sits under the new commit.
            gh release view nightly --json assets --jq '.assets[].name' | while read -r name; do
              case " $assets " in *" $name "*) ;; *) gh release delete-asset nightly "$name" --yes ;; esac
            done
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true > /dev/null \
              || echo "::warning::could not move the nightly tag to ${GITHUB_SHA}; the notes name the commit"
            gh release edit nightly --prerelease --title "Nightly $(date -u +%Y-%m-%d)" --notes "$notes"
          else
            # shellcheck disable=SC2086
            gh release create nightly $assets --prerelease --target "$GITHUB_SHA" --title "Nightly $(date -u +%Y-%m-%d)" --notes "$notes"
          fi
