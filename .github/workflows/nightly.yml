name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every tool must come from mise.lock, with its checksum.
  MISE_LOCKED: '1'

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - id: stamp
        run: echo "name=SharpRail-nightly-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # build-native.sh archives libghostty with Homebrew's llvm-ar.
      - run: brew install llvm
      - uses: actions/cache@v4
        with:
          path: ~/.sharprail/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'mise.android.toml', 'mise.android.lock') }}
      # The terminal library's build fetches its dependencies over git, which drops connections now and then;
      # what it has fetched stays cached, so another attempt carries on from there.
      - run: |
          for attempt in 1 2 3; do
            sh scripts/mise run package:macos osx-arm64 && exit 0
            sleep 30
          done
          exit 1
      - run: sh scripts/mise run dmg "artifacts/${{ steps.stamp.outputs.name }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stamp.outputs.name }}-macos-arm64
          path: artifacts/${{ steps.stamp.outputs.name }}.dmg
          if-no-files-found: error
          compression-level: 0

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: stamp
        run: echo "name=SharpRail-nightly-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.sharprail/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'mise.android.toml', 'mise.android.lock') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The Android workload compiles against this platform, which the runner image may not carry yet.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      # One key for every night, so a newer package installs over an older one.
      - env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/nightly.keystore"
      - env:
          SHARPRAIL_ANDROID_KEYSTORE: ${{ runner.temp }}/nightly.keystore
          SHARPRAIL_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SHARPRAIL_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: sh scripts/mise run package:android
      - run: mv artifacts/android/SharpRail.apk "artifacts/android/${{ steps.stamp.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stamp.outputs.name }}-android
          path: artifacts/android/${{ steps.stamp.outputs.name }}.apk
          if-no-files-found: error
          compression-level: 0

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        # Native MSBuild targets invoke Windows PowerShell; keep its module path consistent.
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: ~\.sharprail\tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'mise.android.toml', 'mise.android.lock') }}
      # Native build scripts still validate their source fingerprints before reusing either DLL.
      - uses: actions/cache/restore@v4
        id: windows-native
        with:
          path: |
            .tools/ghostty-avalonia/win-x64/GhosttyAvaloniaVt.dll
            .tools/ghostty-avalonia/win-x64/fingerprint
            src/SharpRail.Scintilla/obj/native/win-x64/SharpRailScintillaNative.dll
            src/SharpRail.Scintilla/obj/native/win-x64/fingerprint
          key: windows-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.gitattributes', 'global.json', 'Directory.Build.props', 'Directory.Packages.props', 'mise.lock', 'scripts/windows-native.ps1', 'src/Ghostty.Avalonia/build-windows.ps1', 'src/Ghostty.Avalonia/Native/GhosttyVt.c', 'src/Ghostty.Avalonia/Native/GhosttyClipboardStub.c', 'src/SharpRail.Scintilla/build-windows.ps1', 'src/SharpRail.Scintilla/Native/*.h', 'src/SharpRail.Scintilla/Native/*.cxx', 'src/SharpRail.Scintilla/Native/*.patch') }}
      - run: ./scripts/mise.cmd run package:windows -- -RuntimeIdentifier win-x64
      # Save validated native outputs even when the subsequent packaged runtime gate fails.
      - uses: actions/cache/save@v4
        if: steps.windows-native.outputs.cache-hit != 'true'
        with:
          path: |
            .tools/ghostty-avalonia/win-x64/GhosttyAvaloniaVt.dll
            .tools/ghostty-avalonia/win-x64/fingerprint
            src/SharpRail.Scintilla/obj/native/win-x64/SharpRailScintillaNative.dll
            src/SharpRail.Scintilla/obj/native/win-x64/fingerprint
          key: ${{ steps.windows-native.outputs.cache-primary-key }}
      - run: ./scripts/mise.cmd run check:packaged -- -RuntimeIdentifier win-x64 --windows
      - uses: actions/upload-artifact@v4
        with:
          name: SharpRail-nightly-windows-x64
          path: artifacts/SharpRail-win-x64.zip
          if-no-files-found: error
          compression-level: 0

  windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 90
    defaults:
      run:
        # Native MSBuild targets invoke Windows PowerShell; keep its module path consistent.
        shell: powershell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: ~\.sharprail\tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'mise.android.toml', 'mise.android.lock') }}
      # Native build scripts still validate their source fingerprints before reusing either DLL.
      - uses: actions/cache/restore@v4
        id: windows-native
        with:
          path: |
            .tools/ghostty-avalonia/win-arm64/GhosttyAvaloniaVt.dll
            .tools/ghostty-avalonia/win-arm64/fingerprint
            src/SharpRail.Scintilla/obj/native/win-arm64/SharpRailScintillaNative.dll
            src/SharpRail.Scintilla/obj/native/win-arm64/fingerprint
          key: windows-native-arm64-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.gitattributes', 'global.json', 'Directory.Build.props', 'Directory.Packages.props', 'mise.lock', 'scripts/windows-native.ps1', 'src/Ghostty.Avalonia/build-windows.ps1', 'src/Ghostty.Avalonia/Native/GhosttyVt.c', 'src/Ghostty.Avalonia/Native/GhosttyClipboardStub.c', 'src/SharpRail.Scintilla/build-windows.ps1', 'src/SharpRail.Scintilla/Native/*.h', 'src/SharpRail.Scintilla/Native/*.cxx', 'src/SharpRail.Scintilla/Native/*.patch') }}
      - run: ./scripts/mise.cmd run package:windows -- -RuntimeIdentifier win-arm64
      # Save validated native outputs even when the subsequent packaged runtime gate fails.
      - uses: actions/cache/save@v4
        if: steps.windows-native.outputs.cache-hit != 'true'
        with:
          path: |
            .tools/ghostty-avalonia/win-arm64/GhosttyAvaloniaVt.dll
            .tools/ghostty-avalonia/win-arm64/fingerprint
            src/SharpRail.Scintilla/obj/native/win-arm64/SharpRailScintillaNative.dll
            src/SharpRail.Scintilla/obj/native/win-arm64/fingerprint
          key: ${{ steps.windows-native.outputs.cache-primary-key }}
      - run: ./scripts/mise.cmd run check:packaged -- -RuntimeIdentifier win-arm64 --windows
      - uses: actions/upload-artifact@v4
        with:
          name: SharpRail-nightly-windows-arm64
          path: artifacts/SharpRail-win-arm64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [dmg, apk, windows, windows-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      # One prerelease that moves: the tag follows the commit, and the files keep their names from night to night.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv packages/*.dmg SharpRail-nightly.dmg
          mv packages/*.apk SharpRail-nightly.apk
          mv packages/SharpRail-win-x64.zip SharpRail-nightly-win-x64.zip
          mv packages/SharpRail-win-arm64.zip SharpRail-nightly-win-arm64.zip
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly SharpRail-nightly.dmg SharpRail-nightly.apk SharpRail-nightly-win-x64.zip SharpRail-nightly-win-arm64.zip --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%d). The disk image is for Apple silicon and is not notarized; the Android package is a client for a SharpRail host; the unsigned Windows x64 and ARM64 ZIPs each contain the desktop client and standalone host."
